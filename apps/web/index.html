<!doctype html>
<html lang="ru" data-theme="glass">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#e9f1fc" />
    <meta
      name="description"
      content="Arklock — корпоративный менеджер паролей с шифрованием в браузере для размещения на своих серверах."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Arklock</title>
    <style>
      /* до загрузки основного стиля: фон и цвет текста выбранной темы, чтобы не было белой вспышки */
      html {
        background: #e9f1fc;
      }
      html[data-theme='night'] {
        background: #0e1024;
      }
      html[data-theme='grove'] {
        background: #f4f6f3;
      }
      html[data-theme='aurora'] {
        background: #061326;
      }
    </style>
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
