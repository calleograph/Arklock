name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: format, lint, typecheck, test, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run lint
      # typecheck зависит от собранных пакетов (@arklock/crypto, @arklock/contracts)
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: browser end-to-end
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7

  dependencies:
    name: dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=high
      - run: node scripts/check-licenses.mjs

  private-data:
    # Секреты, частные домены и адреса не должны попадать в публичный репозиторий.
    name: secrets and private data scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/check-private-data.mjs --history

  container:
    name: container build, integration and restore test
    runs-on: ubuntu-24.04
    env:
      POSTGRES_PASSWORD: ci-only-db-password-XJ3k9
      APP_SECRET: ci-only-app-secret-ci-only-app-secret-Qw81
      BOOTSTRAP_TOKEN: ci-bootstrap-token-ci-bootstrap-1
      SETUP_TOKEN: ci-bootstrap-token-ci-bootstrap-1
      APP_VERSION: ci
      APP_GIT_COMMIT: ${{ github.sha }}
      BASE_URL: http://127.0.0.1:8080
      STATE_FILE: ${{ github.workspace }}/smoke-state.json
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build -w @arklock/crypto
      - name: Build and start the stack on an empty database
        run: |
          docker compose config -q
          sudo install -d -m 0750 -o 1000 -g 1000 /var/lib/arklock/blobs
          docker compose up -d --build --wait --wait-timeout 180
      - name: Probes
        run: |
          curl -fsS "$BASE_URL/api/v1/health"
          curl -fsS "$BASE_URL/api/v1/ready"
          curl -fsS "$BASE_URL/api/v1/version"
          curl -fsS "$BASE_URL/" | grep -q '<div id="app">'
      - name: Integration - register, store and read an encrypted entry
        run: node scripts/smoke-container.mjs write
      - name: Container hardening
        run: |
          test "$(docker compose exec -T app id -u)" != "0"
          docker inspect "$(docker compose ps -q app)" --format '{{.HostConfig.ReadonlyRootfs}} {{.HostConfig.CapDrop}}' | tee /dev/stderr | grep -q 'true \[ALL\]'
          # база данных не опубликована на хосте
          if (exec 3<>/dev/tcp/127.0.0.1/5432) 2>/dev/null; then echo "PostgreSQL is reachable from the host"; exit 1; fi
      - name: Data survives container re-creation
        run: |
          docker compose down
          docker compose up -d --wait --wait-timeout 180
          node scripts/smoke-container.mjs verify
      - name: Backup and restore of the database
        run: |
          docker compose exec -T db pg_dump -U arklock -Fc arklock > backup.dump
          test -s backup.dump
          docker compose exec -T db createdb -U arklock restore_check
          docker compose exec -T db pg_restore -U arklock -d restore_check --no-owner < backup.dump
          n=$(docker compose exec -T db psql -U arklock -d restore_check -tAc 'select count(*) from entries')
          u=$(docker compose exec -T db psql -U arklock -d restore_check -tAc 'select count(*) from users')
          echo "restored: users=$u entries=$n"
          test "$n" = 1
          test "$u" = 1
      - name: No secrets in image layers or logs
        run: |
          docker history --no-trunc arklock:local > history.txt
          docker compose logs --no-color > logs.txt
          for s in "$POSTGRES_PASSWORD" "$APP_SECRET" "$(node -p "require('./smoke-state.json').password")" "$(node -p "require('./smoke-state.json').secret.password")"; do
            if grep -qF -- "$s" history.txt logs.txt; then echo "secret value found in image history or logs"; exit 1; fi
          done
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - if: always()
        run: docker compose down -v

  scripts:
    name: shell scripts (syntax, shellcheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: |
          rc=0
          for f in install.sh scripts/*.sh scripts/lib/*.sh; do
            bash -n "$f" || rc=1
          done
          exit $rc
      - run: shellcheck -x -S warning install.sh scripts/*.sh scripts/lib/*.sh tests/update/*.sh tests/updater/*.sh

  installer:
    name: installer, backup and restore on a clean Ubuntu 24.04 runner
    runs-on: ubuntu-24.04
    env:
      CFG: /etc/arklock-ci
      DATA: /var/lib/arklock-ci
      PROJ: arklock-ci
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build -w @arklock/crypto
      - name: Dry run changes nothing
        run: |
          sudo ./install.sh --dry-run --yes --profile standalone --project "$PROJ" --config "$CFG" --data "$DATA"
          test ! -e "$CFG/arklock.env"
      - name: Install (standalone)
        run: sudo ./install.sh --yes --profile standalone --project "$PROJ" --config "$CFG" --data "$DATA" 2>&1 | tee install.log
      - name: Install output has the setup instructions and no secrets other than the setup code
        run: |
          grep -q "УСТАНОВКА ЗАВЕРШЕНА" install.log
          pw="$(sudo sed -n 's/^POSTGRES_PASSWORD=//p' "$CFG/arklock.env")"
          sec="$(sudo sed -n 's/^APP_SECRET=//p' "$CFG/arklock.env")"
          if grep -qF -- "$pw" install.log || grep -qF -- "$sec" install.log; then echo "secret printed by installer"; exit 1; fi
          test "$(sudo stat -c '%a' "$CFG/arklock.env")" = 600
          test "$(sudo stat -c '%a' "$CFG/backup.key")" = 600
      - name: Re-running the installer keeps secrets and data
        run: |
          before="$(sudo sha256sum "$CFG/arklock.env" "$CFG/backup.key")"
          sudo ./install.sh --yes --profile standalone --project "$PROJ" --config "$CFG" --data "$DATA"
          after="$(sudo sha256sum "$CFG/arklock.env" "$CFG/backup.key")"
          test "$before" = "$after"
      - name: Load instance settings
        run: |
          echo "PORT=$(sudo sed -n 's/^APP_PORT=//p' "$CFG/arklock.env")" >> "$GITHUB_ENV"
          echo "SETUP_TOKEN=$(sudo sed -n 's/^BOOTSTRAP_TOKEN=//p' "$CFG/arklock.env")" >> "$GITHUB_ENV"
      - name: First administrator requires the setup code
        run: |
          code="$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{}' "http://127.0.0.1:$PORT/api/v1/auth/register")"
          test "$code" = 400
          curl -fsS "http://127.0.0.1:$PORT/api/v1/auth/registration" | grep -q '"setupTokenRequired":true'
      - name: Scripts verify, smoke-test, status, diag
        run: |
          sudo ./scripts/verify.sh --env "$CFG/arklock.env"
          sudo ./scripts/smoke-test.sh --env "$CFG/arklock.env"
          sudo ./scripts/status.sh --env "$CFG/arklock.env"
          sudo ./scripts/preflight.sh --env "$CFG/arklock.env"
          sudo ./scripts/diag.sh --env "$CFG/arklock.env"
          pkg="$(sudo sh -c 'ls -1 /var/lib/arklock-ci/tmp/arklock-diag-*.tar.gz' | head -n 1)"
          sudo tar -xzOf "$pkg" > diag.txt
          pw="$(sudo sed -n 's/^POSTGRES_PASSWORD=//p' "$CFG/arklock.env")"
          if grep -qF -- "$pw" diag.txt; then echo "secret in diagnostic package"; exit 1; fi
      - name: Register a user and store an encrypted entry
        env:
          BASE_URL: http://127.0.0.1:${{ env.PORT }}
          STATE_FILE: ${{ github.workspace }}/smoke-state.json
        run: node scripts/smoke-container.mjs write
      - name: Encrypted backup and its verification
        run: |
          sudo ./scripts/backup.sh --env "$CFG/arklock.env"
          f="$(sudo sh -c 'ls -1t /var/lib/arklock-ci/backups/*.bak.gpg' | head -n 1)"
          echo "BACKUP=$f" >> "$GITHUB_ENV"
          sudo ./scripts/backup.sh --env "$CFG/arklock.env" --verify "$f"
          # копия зашифрована: ни логин пользователя, ни пароль записи в открытом виде в ней не встречаются
          user="$(node -p "require('./smoke-state.json').email")"
          secret="$(node -p "require('./smoke-state.json').secret.password")"
          if sudo grep -aqF -- "$user" "$f" || sudo grep -aqF -- "$secret" "$f"; then echo "plaintext in backup"; exit 1; fi
      - name: A corrupted backup is rejected
        run: |
          sudo cp "$BACKUP" /tmp/corrupt.bak.gpg
          sudo sh -c 'printf "X" | dd of=/tmp/corrupt.bak.gpg bs=1 seek=300 conv=notrunc 2>/dev/null'
          if sudo ./scripts/backup.sh --env "$CFG/arklock.env" --verify /tmp/corrupt.bak.gpg; then echo "corrupted backup accepted"; exit 1; fi
      - name: Disaster - destroy the database, re-install, restore from backup
        run: |
          sudo docker compose --project-name "$PROJ" down -v
          # файлы вложений тоже уничтожены: их должна вернуть копия
          sudo rm -rf "$DATA/blobs"
          sudo ./install.sh --yes --profile standalone --project "$PROJ" --config "$CFG" --data "$DATA"
          sudo ./scripts/restore.sh "$BACKUP" --env "$CFG/arklock.env" --yes
      - name: After restore the same user decrypts the same entry
        env:
          BASE_URL: http://127.0.0.1:${{ env.PORT }}
          STATE_FILE: ${{ github.workspace }}/smoke-state.json
        run: node scripts/smoke-container.mjs verify
      - name: Repair is safe on a healthy system
        run: sudo ./scripts/repair.sh --env "$CFG/arklock.env"
      - name: Cleanup
        if: always()
        run: |
          sudo docker compose --project-name "$PROJ" logs --no-color --tail=100 || true
          sudo docker compose --project-name "$PROJ" down -v || true

  shared-host:
    name: shared-host profile leaves foreign services untouched
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Foreign application on the same host
        run: |
          docker run -d --name foreign-app -p 18081:80 nginx:alpine
          docker run -d --name foreign-db -e POSTGRES_PASSWORD=x postgres:16-alpine
          sleep 3
          echo "FOREIGN_APP=$(docker inspect -f '{{.Id}} {{.State.StartedAt}}' foreign-app)" >> "$GITHUB_ENV"
          echo "FOREIGN_DB=$(docker inspect -f '{{.Id}} {{.State.StartedAt}}' foreign-db)" >> "$GITHUB_ENV"
      - name: Occupied port is refused without side effects
        run: |
          if sudo ./install.sh --yes --profile shared-host --project arklock-sh --config /etc/arklock-sh --data /var/lib/arklock-sh --port 18081; then echo "installer took an occupied port"; exit 1; fi
      - name: Install next to foreign containers
        run: sudo ./install.sh --yes --profile shared-host --project arklock-sh --config /etc/arklock-sh --data /var/lib/arklock-sh
      - name: Foreign containers and ports are intact
        run: |
          test "$(docker inspect -f '{{.Id}} {{.State.StartedAt}}' foreign-app)" = "$FOREIGN_APP"
          test "$(docker inspect -f '{{.Id}} {{.State.StartedAt}}' foreign-db)" = "$FOREIGN_DB"
          curl -fsS http://127.0.0.1:18081/ | grep -qi nginx
          sudo ./scripts/verify.sh --env /etc/arklock-sh/arklock.env
          port="$(sudo sed -n 's/^APP_PORT=//p' /etc/arklock-sh/arklock.env)"
          test "$port" != 18081
      - name: Cleanup
        if: always()
        run: |
          sudo docker compose --project-name arklock-sh down -v || true
          docker rm -f foreign-app foreign-db || true

  update-flow:
    name: update, failed update recovery and rollback
    runs-on: ubuntu-24.04
    env:
      CFG: /etc/arklock-up
      DATA: /var/lib/arklock-up
      APPDIR: /opt/arklock-up
      PROJ: arklock-up
      ARKLOCK_UPDATE_WAIT: '90'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build -w @arklock/crypto
      - name: Build the release fixture (v0.0.1 base, v0.0.2 migration, v0.0.3 broken migration, v0.0.4 broken build)
        run: tests/update/make-fixture.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/origin.git"
      - name: Install v0.0.1 with the stand-alone installer (bootstrap from the repository)
        run: |
          cp install.sh "$RUNNER_TEMP/install-standalone.sh"
          sudo "$RUNNER_TEMP/install-standalone.sh" --yes --profile standalone --repo "file://$RUNNER_TEMP/origin.git" --ref v0.0.1 \
            --dir "$APPDIR" --project "$PROJ" --config "$CFG" --data "$DATA"
          echo "PORT=$(sudo sed -n 's/^APP_PORT=//p' "$CFG/arklock.env")" >> "$GITHUB_ENV"
          echo "SETUP_TOKEN=$(sudo sed -n 's/^BOOTSTRAP_TOKEN=//p' "$CFG/arklock.env")" >> "$GITHUB_ENV"
          test "$(curl -fsS "http://127.0.0.1:$(sudo sed -n 's/^APP_PORT=//p' "$CFG/arklock.env")/api/v1/version" | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).version')" = 0.0.1
      - name: Create a user and an entry on v0.0.1
        env:
          BASE_URL: http://127.0.0.1:${{ env.PORT }}
          STATE_FILE: ${{ github.workspace }}/smoke-state.json
        run: node scripts/smoke-container.mjs write
      - name: Update check reports the new version
        run: |
          set +e
          sudo "$APPDIR/scripts/check-updates.sh" --env "$CFG/arklock.env"
          rc=$?
          test "$rc" = 10
      - name: Update to v0.0.2 (new migration) succeeds and keeps data
        env:
          BASE_URL: http://127.0.0.1:${{ env.PORT }}
          STATE_FILE: ${{ github.workspace }}/smoke-state.json
        run: |
          sudo "$APPDIR/scripts/update.sh" --env "$CFG/arklock.env" --ref v0.0.2 --yes
          test "$(curl -fsS "$BASE_URL/api/v1/version" | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).version')" = 0.0.2
          test "$(sudo docker compose --project-name "$PROJ" exec -T db psql -U arklock -d arklock -tAc "select to_regclass('public.update_probe') is not null")" = t
          node scripts/smoke-container.mjs verify
          sudo ls "$DATA"/backups | grep -q pre-update
      - name: Rollback is refused automatically because the schema changed
        run: |
          set +e
          sudo "$APPDIR/scripts/rollback.sh" --env "$CFG/arklock.env" --yes
          rc=$?
          test "$rc" = 3
          test "$(curl -fsS "http://127.0.0.1:$PORT/api/v1/version" | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).version')" = 0.0.2
      - name: Rollback with restore returns to v0.0.1 and the data survives
        env:
          BASE_URL: http://127.0.0.1:${{ env.PORT }}
          STATE_FILE: ${{ github.workspace }}/smoke-state.json
        run: |
          sudo "$APPDIR/scripts/rollback.sh" --env "$CFG/arklock.env" --yes --with-restore
          test "$(curl -fsS "$BASE_URL/api/v1/version" | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).version')" = 0.0.1
          test "$(sudo docker compose --project-name "$PROJ" exec -T db psql -U arklock -d arklock -tAc "select to_regclass('public.update_probe') is not null")" = f
          node scripts/smoke-container.mjs verify
      - name: A failing migration (v0.0.3) is recovered automatically
        env:
          BASE_URL: http://127.0.0.1:${{ env.PORT }}
          STATE_FILE: ${{ github.workspace }}/smoke-state.json
        run: |
          set +e
          sudo "$APPDIR/scripts/update.sh" --env "$CFG/arklock.env" --ref v0.0.3 --yes
          rc=$?
          set -ex
          test "$rc" != 0
          test "$(curl -fsS "$BASE_URL/api/v1/version" | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).version')" = 0.0.1
          sudo grep -q 'status=rolled_back' "$DATA/state/update.state"
          node scripts/smoke-container.mjs verify
      - name: A failing image build (v0.0.4) leaves the running version untouched
        env:
          BASE_URL: http://127.0.0.1:${{ env.PORT }}
          STATE_FILE: ${{ github.workspace }}/smoke-state.json
        run: |
          set +e
          sudo "$APPDIR/scripts/update.sh" --env "$CFG/arklock.env" --ref v0.0.4 --yes
          rc=$?
          set -ex
          test "$rc" != 0
          test "$(curl -fsS "$BASE_URL/api/v1/version" | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).version')" = 0.0.1
          sudo grep -q 'status=failed_build' "$DATA/state/update.state"
          node scripts/smoke-container.mjs verify
      - name: Unavailable repository does not disturb the running system
        env:
          BASE_URL: http://127.0.0.1:${{ env.PORT }}
        run: |
          mv "$RUNNER_TEMP/origin.git" "$RUNNER_TEMP/origin.gone"
          set +e
          sudo "$APPDIR/scripts/check-updates.sh" --env "$CFG/arklock.env"
          rc1=$?
          sudo "$APPDIR/scripts/update.sh" --env "$CFG/arklock.env" --yes
          rc2=$?
          set -e
          mv "$RUNNER_TEMP/origin.gone" "$RUNNER_TEMP/origin.git"
          test "$rc1" = 1
          test "$rc2" != 0
          curl -fsS "$BASE_URL/api/v1/ready"
      - name: Update logs are kept and contain no secrets
        run: |
          sudo test -s "$DATA/logs/updates.log"
          pw="$(sudo sed -n 's/^POSTGRES_PASSWORD=//p' "$CFG/arklock.env")"
          if sudo grep -qF -- "$pw" "$DATA/logs/updates.log"; then echo "secret in update log"; exit 1; fi
      - name: Cleanup
        if: always()
        run: sudo docker compose --project-name "$PROJ" down -v || true

  update-from-web:
    name: helper service and update from the browser
    runs-on: ubuntu-24.04
    env:
      CFG: /etc/arklock-web
      DATA: /var/lib/arklock-web
      APPDIR: /opt/arklock-web
      PROJ: arklock-web
      ARKLOCK_UPDATE_WAIT: '120'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: bash tests/updater/test-parse.sh
      - name: Release fixture (v0.0.1 and v0.0.2)
        run: |
          tests/update/web-fixture.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/origin.git"
          # служба помощника не видит /home и /tmp (ProtectHome, PrivateTmp), поэтому «удалённый» репозиторий лежит в /srv
          sudo mv "$RUNNER_TEMP/origin.git" /srv/origin-web.git
          sudo chown -R "$(id -u):$(id -g)" /srv/origin-web.git
      - name: Install v0.0.1; the helper service starts
        run: |
          cp install.sh "$RUNNER_TEMP/install-standalone.sh"
          sudo "$RUNNER_TEMP/install-standalone.sh" --yes --profile standalone --repo "file:///srv/origin-web.git" --ref v0.0.1 \
            --dir "$APPDIR" --project "$PROJ" --config "$CFG" --data "$DATA" | tee install.log
          grep -q "Помощник обновлений: работает" install.log
          systemctl is-active "arklock-updater-$PROJ"
          sudo "$APPDIR/scripts/updater.sh" status --env "$CFG/arklock.env"
          echo "PORT=$(sudo sed -n 's/^APP_PORT=//p' "$CFG/arklock.env")" >> "$GITHUB_ENV"
          echo "LIVE_SETUP_TOKEN=$(sudo sed -n 's/^BOOTSTRAP_TOKEN=//p' "$CFG/arklock.env")" >> "$GITHUB_ENV"
      - name: Helper rejects forged requests
        run: |
          set -x
          before="$(curl -fsS "http://127.0.0.1:$PORT/api/v1/version")"
          sudo sh -c "printf 'request_id=123e4567-e89b-42d3-a456-426614174000\naction=update\nversion=v0.0.2;touch /tmp/pwned\n' > '$DATA/updater/request.txt'"
          for i in $(seq 1 20); do sudo grep -q '"result":"rejected"' "$DATA/updater/status.json" 2>/dev/null && break; sleep 1; done
          sudo grep -q '"result":"rejected"' "$DATA/updater/status.json"
          test ! -e /tmp/pwned
          sudo sh -c "ln -sf /etc/passwd '$DATA/updater/request.txt'"
          sleep 5
          test ! -e "$DATA/updater/request.txt" || sudo test ! -L "$DATA/updater/request.txt"
          test "$(curl -fsS "http://127.0.0.1:$PORT/api/v1/version")" = "$before"
      - name: Helper survives a restart
        run: |
          sudo systemctl restart "arklock-updater-$PROJ"
          sleep 6
          sudo "$APPDIR/scripts/updater.sh" status --env "$CFG/arklock.env"
      - name: Browser - check, update with re-authentication, failed release recovery
        env:
          LIVE_BASE_URL: http://127.0.0.1:${{ env.PORT }}
          LIVE_ORIGIN: /srv/origin-web.git
        run: |
          npx playwright install --with-deps chromium
          npm run build
          npx playwright test --project=live
      - name: Diagnostics on failure
        if: failure()
        run: |
          sudo journalctl -u "arklock-updater-$PROJ" --no-pager -n 80 || true
          sudo cat "$DATA/updater/update.log" || true
          sudo cat "$DATA/updater/status.json" || true
          sudo ls -l "$DATA/updater" || true
          sudo cat "$DATA/updater/history.jsonl" || true
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-live-traces
          path: test-results
          retention-days: 7
      - name: Cleanup
        if: always()
        run: |
          sudo "$APPDIR/scripts/updater.sh" uninstall --env "$CFG/arklock.env" || true
          sudo docker compose --project-name "$PROJ" down -v || true
