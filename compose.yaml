# Arklock: приложение + PostgreSQL. Секреты берутся из .env (см. .env.example), в образах их нет.
name: ${COMPOSE_PROJECT_NAME:-arklock}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: arklock
      POSTGRES_USER: arklock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U arklock -d arklock']
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt: ['no-new-privileges:true']
    stop_grace_period: 30s
    networks: [internal]

  app:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-0.0.0}
        APP_GIT_COMMIT: ${APP_GIT_COMMIT:-unknown}
        APP_BUILT_AT: ${APP_BUILT_AT:-unknown}
    image: ${ARKLOCK_IMAGE:-arklock:local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://arklock:${POSTGRES_PASSWORD}@db:5432/arklock
      APP_SECRET: ${APP_SECRET:?задайте APP_SECRET в .env}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      UPDATE_CHANNEL: ${UPDATE_CHANNEL:-stable}
    # Порт публикуется только на loopback: наружу смотрит reverse proxy с HTTPS.
    ports:
      - '127.0.0.1:${APP_PORT:-8080}:8080'
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    stop_grace_period: 20s
    networks: [internal, default]

volumes:
  db-data:

networks:
  internal:
    internal: true
